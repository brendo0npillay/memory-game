<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory game</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1 id="header">Memory Game</h1>
    <div class="info">
    <h1 id="timer">00:00:00</h1>
    </div>
    <div class="buttonContainer">
    <button id="restartButton">RESTART</button>
    </div>
    <br />
    <div class="main-game"></div><br>
    <span id="flips">Flips: 0</span><br>
    <p></p>
    <div id="grids">
      <button id="two">2x2</button>
      <button id="three">3x2</button>
      <button id="four">4x2</button>
      <button id="fourByThree">4x3</button>
    </div>
    <br />
    <hr />
    <p></p>
    <div
      class="modal fade"
      id="gamePassed"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-labelledby="passed"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="modalHeader">Congrats!</h1>
          </div>
          <div id="winMsg" class="modal-body">You have matched all cards!</div>
          <div class="modal-footer">
            <button id="restart" type="button" class="btn btn-primary">
              Restart
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./dist/bundle.js"></script>
  </body>
</html>
